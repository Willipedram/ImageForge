[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imageforge"
version = "0.1.0"
description = "Safe website image optimization desktop application"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7,<7", "paramiko>=3.5,<5", "Pillow>=11,<13", "PyMySQL>=1.1,<2", "psutil>=6,<8"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[project.scripts]
imageforge = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
